<div class="gerenciamento-container">
  <h1 class="titulo-gerenciamento">Gerenciamento de Carros</h1>

  <!-- Card Principal -->
  <div class="painel-estoque">
    <div class="topo-tabela">
      <div class="coluna-foto">Foto</div>
      <div class="coluna-marca">Marca</div>
      <div class="coluna-modelo">Modelo</div>
      <div class="coluna-estoque">Estoque</div>
      <div class="coluna-acoes">
        <!-- Ícone de atualizar -->
        <button class="btn-atualizar" title="Atualizar">
          <img src="images/refresh.png" alt="Atualizar" class="icone-btn" />
        </button>
      </div>
    </div>

    <!-- Lista dos Carros -->
    <div class="linhas-tabela">
      <!-- Veículo 1: BYD King -->
      <div class="linha-carro">
        <div class="coluna-foto">
          <img
            src="https://gabcomercio.azureedge.net/godrive/blog/byd-king-ficha-tecnica/main_image.webp"
            alt="BYD King"
            class="img-carro-thumb"
          />
        </div>
        <span class="coluna-marca">BYD</span>
        <span class="coluna-modelo">King</span>
        <span class="coluna-estoque">1</span>
        <div class="coluna-acoes">
          <button class="btn-editar" title="Editar">
            <img src="images/edit.png" alt="Editar" class="icone-btn" />
          </button>
          <button class="btn-excluir" title="Excluir">
            <img src="images/lixeira.png" alt="Excluir" class="icone-btn" />
          </button>
        </div>
      </div>

      <!-- Veículo 2: Toyota Corolla Cross -->
      <div class="linha-carro">
        <div class="coluna-foto">
          <img
            src="https://cdn.motor1.com/images/mgl/ljVZ1/s1/2022-toyota-corolla-cross-us-spec.jpg"
            alt="Toyota Corolla Cross"
            class="img-carro-thumb"
          />
        </div>
        <span class="coluna-marca">Toyota</span>
        <span class="coluna-modelo">Corolla Cross</span>
        <span class="coluna-estoque">1</span>
        <div class="coluna-acoes">
          <button class="btn-editar" title="Editar">
            <img src="images/edit.png" alt="Editar" class="icone-btn" />
          </button>
          <button class="btn-excluir" title="Excluir">
            <img src="images/lixeira.png" alt="Excluir" class="icone-btn" />
          </button>
        </div>
      </div>

      <!-- Veículo 3: Jeep Renegade -->
      <div class="linha-carro">
        <div class="coluna-foto">
          <img
            src="https://www.jeep.com.br/content/dam/jeep/open-graph/open-graph-renegade.webp"
            alt="Jeep Renegade"
            class="img-carro-thumb"
          />
        </div>
        <span class="coluna-marca">Jeep</span>
        <span class="coluna-modelo">Renegade</span>
        <span class="coluna-estoque">1</span>
        <div class="coluna-acoes">
          <button class="btn-editar" title="Editar">
            <img src="images/edit.png" alt="Editar" class="icone-btn" />
          </button>
          <button class="btn-excluir" title="Excluir">
            <img src="images/lixeira.png" alt="Excluir" class="icone-btn" />
          </button>
        </div>
      </div>
    </div>

    <!-- Botão de Registrar Carro -->
    <div class="rodape-painel">
      <button class="btn-registrar">Registrar Carro</button>
    </div>
  </div>
</div>
