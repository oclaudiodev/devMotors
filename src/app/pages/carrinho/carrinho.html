<h1>Carrinho</h1>

<div id="container">

    <div class="titulo-carrinho">
        <h2>Suas escolhas:</h2>
    </div>

    <table>
        <thead>
            <tr>
                <th>Foto</th>
                <th>Carro</th>
                <th>Quantidade</th>
                <th>Preço</th>
                <th>Ação</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>
                    <img 
                        class="img-carro"
                        src="https://img.odcdn.com.br/wp-content/uploads/2023/05/2023-fiat-topolino.jpg"
                        alt="Carro"
                    >
                </td>

                <td>Carro das antiga</td>

                <td>1</td>

                <td>R$ 50.000,00</td>

                <td>
                    <button type="button"class="excluir"(click)="abrirModalExcluir()">
                        <img 
                            src="images/lixeira.png" 
                            alt="Excluir" 
                            class="icone-btn"
                        />
                    </button>
                </td>
            </tr>
            <tr>
                <td>
                    <img 
                        class="img-carro"
                        src="https://s2-techtudo.glbimg.com/srZjXTzBpmIEs_BDMXGjazLVA34=/0x0:620x408/984x0/smart/filters:strip_icc()/i.s3.glbimg.com/v1/AUTH_08fbf48bc0524877943fe86e43087e7a/internal_photos/bs/2021/2/M/khQa50TAADCnWXVqeL1g/2012-01-06-misha-01.jpg"
                        alt="Carro2"
                    >
                </td>

                <td>Carro das antiga</td>

                <td>1</td>

                <td>R$ 50.000,00</td>

                <td>
                    <button type="button"class="excluir"(click)="abrirModalExcluir()">
                        <img 
                            src="images/lixeira.png" 
                            alt="Excluir" 
                            class="icone-btn"
                        />
                    </button>
                </td>
            </tr>
            <tr>
                <td>
                    <img 
                        class="img-carro"
                        src="https://uploads.automaistv.com.br/2024/02/gurgel_br-800_2-1320x792.jpg"
                        alt="Carro3"
                    >
                </td>

                <td>Carro das antiga</td>

                <td>1</td>

                <td>R$ 50.000,00</td>

                <td>
                    <button type="button"class="excluir"(click)="abrirModalExcluir()">
                        <img 
                            src="images/lixeira.png" 
                            alt="Excluir" 
                            class="icone-btn"
                        />
                    </button>
                </td>
            </tr>
        </tbody>
    </table>

    <div class="cupom">
        <div>
            <label for="cupom">Cupom promocional:</label>
            <input type="text" id="cupom" name="cupom" placeholder="digite seu cupom aqui">
        </div>
        
        <div>
            <p>Total: R$ 150.000,00</p>
        </div>
    </div>

    <div class="comprar">
        <button>
            Comprar
        </button>
    </div>

    @if (exibirModalExcluir) {
    <div class="modal-overlay">
        <div class="modal-card modal-excluir">

            <h2>EXCLUIR CARRO</h2>

            <p class="subtitulo-modal">
                Confirmar Exclusão
            </p>

            <div class="botoes-confirmacao">

                <button 
                    type="button" 
                    class="btn-nao"
                    (click)="fecharModal()">
                    Não
                </button>

                <button 
                    type="button" 
                    class="btn-sim"
                    (click)="fecharModal()">
                    Sim
                </button>

            </div>

        </div>
    </div>
    }


</div>
