<div class="register-page-container">
    <div class="register-card-container">
        <h1 class="page-title">Registre - se</h1>

        <div class="register-card">

            <div class="register-form-side">

                    <div class="input-group">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" name="nome" [(ngModel)]="cliente.nome" required>
                    </div>

                    <div class="input-group">
                        <label for="sobrenome">Sobrenome</label>
                        <input type="text" id="sobrenome" name="sobrenome" [(ngModel)]="cliente.sobrenome">
                    </div>

                    <div class="input-group">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" name="cpf" [(ngModel)]="cliente.cpf" required>
                    </div>

                    <div class="input-group">
                        <label for="dataNascimento">Data de Nascimento</label>
                        <input type="date" id="dataNascimento" name="dataNascimento" [(ngModel)]="cliente.dataNascimento">
                    </div>

                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" [(ngModel)]="cliente.email" required>
                    </div>

                    <div class="input-group">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" name="senha" [(ngModel)]="cliente.senha" required>
                    </div>

                    <div class="input-group">
                        <label for="confirme-senha">Confirme a Senha</label>
                        <input type="password" id="confirme-senha" name="confirme-senha" [(ngModel)]="confirmarSenha" required>
                    </div>

                    <div class="register-actions">
                        <button type="button" class="btn-cadastrar-main" (click)="cadastrar()">
                            Cadastrar
                        </button>
                        <button type="button" class="btn-google">
                            <img class="google-icon" src="images/google.jpg" alt="Google">
                        </button>
                    </div>
            </div>

            <div class="card-divider"></div>

            <div class="login-redirect-side">
                <h2>BEM VINDO A MELHOR PAGINA DE VENDA DE CARROS</h2>
                <div class="login-prompt">
                    <span>Já tem cadastro?</span>
                    <button type="button" class="btn-login-link" (click)="voltarParaLogin()">Login</button>
                </div>

                <div class="google-icon-wrapper">
                    <img class="google-icon" src="images/google.jpg" alt="Google">
                </div>
            </div>

        </div>
    </div>
</div>
