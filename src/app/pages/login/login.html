<div class="login-page-container">
    <div class="login-card-container">
        <h1 class="page-title">Login</h1>

        <div class="login-card">

            <div class="login-form-side">
                

                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email"
                            id="email"
                            name="login"
                            [(ngModel)]="login"
                            (input)="validarFormulario()"
                            required>
                    </div>

                    <div class="input-group">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" name="senha"
                            [(ngModel)]="senha"
                            (input)="validarFormulario()"
                            required>
                        <a href="#" class="forgot-password">esqueceu a senha?</a>
                    </div>

                    <div class="login-actions">
                        <button type="submit" class="btn-login" [disabled]="botaoDesabilitado" (click)="fazerLogin()">
                            Login
                        </button>
                        <button type="button" class="btn-google">
                            <img class="google-icon" src="images/google.jpg" alt="Google">
                        </button>
                    </div>

                
            </div>

            <div class="card-divider"></div>

            <div class="register-side">
                <h2>BEM VINDO A MELHOR PAGINA DE VENDA DE CARROS</h2>
                <div class="register-prompt">
                    <span>Não possui cadastro?</span>
                    <button type="button" class="btn-cadastrar"(click)="irParaRegistro()">Cadastrar</button>
                </div>
                <div class="google-icon-wrapper">
                    <img class="google-icon" src="images/google.jpg" alt="Google">
                </div>
            </div>

        </div>
    </div>
</div>
